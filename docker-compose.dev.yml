# Development override. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Differences from production:
#   - full Go toolchain image (Dockerfile.dev)
#   - source bind-mounted, rebuilt/restarted by Air on change
#   - APP_ENV=development
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: taskmanager:dev
    environment:
      APP_ENV: development
    volumes:
      - .:/src
      - go_module_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    command: ["air", "-c", ".air.toml"]

volumes:
  go_module_cache:
  go_build_cache:
