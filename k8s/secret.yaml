# Demo credentials only. Use SealedSecrets/ExternalSecrets in a real cluster.
apiVersion: v1
kind: Secret
metadata:
  name: taskmanager-postgres
  namespace: taskmanager
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: tasks
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/tasks?sslmode=disable
